<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Cozy Dark Background -->
  <rect width="100%" height="100%" fill="#0b0b0b"/>
  
  <!-- Subtle Soft Circle -->
  <circle cx="250" cy="220" r="120" fill="none" stroke="#222222" stroke-width="1.5"/>
  <circle cx="250" cy="220" r="116" fill="none" stroke="#c5a880" stroke-width="0.8" opacity="0.4"/>

  <!-- Minimal Line Art Icon (Abstract 'V' & Calm Arc) -->
  <g transform="translate(0, 0)">
    <!-- Smooth Aesthetic V -->
    <path d="M 215 185 L 250 255 L 285 185" fill="none" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cozy Crescent Accent -->
    <path d="M 235 210 Q 250 195 265 210" fill="none" stroke="#c5a880" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Minimalist Soft Dot -->
    <circle cx="250" cy="165" r="3" fill="#c5a880"/>
  </g>

  <!-- Clean Minimalist Typography -->
  <!-- Main Brand Name -->
  <text x="250" y="380" font-family="'Poppins', 'Helvetica Neue', sans-serif" font-size="28" font-weight="300" fill="#f4f1ea" letter-spacing="14" text-anchor="middle">
    VAYNRO
  </text>
  
  <!-- Clean Tagline -->
  <text x="250" y="410" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="10" font-weight="300" fill="#c5a880" letter-spacing="4" text-anchor="middle" opacity="0.8">
    AESTHETIC FASHION &amp; LIFESTYLE
  </text>
</svg>
