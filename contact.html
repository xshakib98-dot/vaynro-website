<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | VAYNRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0b0b; color: #fff; padding: 20px; }
    
    /* Navigation Bar */
    nav { max-width: 1200px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; }
    nav .logo { font-size: 24px; font-weight: 700; color: #d4af37; letter-spacing: 3px; text-decoration: none; }
    nav .nav-links { display: flex; gap: 20px; align-items: center; }
    nav .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
    nav .nav-links a:hover, nav .nav-links a.active { color: #d4af37; }
    nav a.back-btn { color: #fff; text-decoration: none; border: 1px solid #333; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: 0.3s; }
    nav a.back-btn:hover { border-color: #d4af37; color: #d4af37; }

    /* Contact Section Container */
    .contact-container { max-width: 1000px; margin: 40px auto; background: #141414; border: 1px solid #222; border-radius: 16px; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; }
    
    .contact-info { flex: 1; min-width: 280px; }
    .contact-info h2 { font-size: 28px; color: #d4af37; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
    .contact-info p { color: #ccc; line-height: 1.6; font-size: 15px; margin-bottom: 30px; }
    
    .info-item { margin-bottom: 20px; }
    .info-item h4 { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .info-item p { color: #fff; font-weight: 600; font-size: 16px; margin: 0; }
    .info-item a { color: #d4af37; text-decoration: none; }

    .contact-form { flex: 1.2; min-width: 280px; background: #0b0b0b; padding: 25px; border-radius: 12px; border: 1px solid #222; }
    .contact-form h3 { font-size: 18px; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; background: #141414; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: #d4af37; }
    
    .send-btn { width: 100%; background: #d4af37; color: #000; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 14px; transition: 0.3s; }
    .send-btn:hover { background: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">VAYNRO</a>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html" class="active">Contact Us</a>
      <a href="index.html" class="back-btn">← Back to Shop</a>
    </div>
  </nav>

  <div class="contact-container">
    <div class="contact-info">
      <h2>Get In Touch</h2>
      <p>Have questions about our products, orders, or custom requests? Feel free to reach out to us. We are here to help!</p>
      
      <div class="info-item">
        <h4>Phone / bKash</h4>
        <p>+880 1725373633</p>
      </div>

      <div class="info-item">
        <h4>Email Support</h4>
        <p><a href="mailto:support@vaynro.com">support@vaynro.com</a></p>
      </div>

      <div class="info-item">
        <h4>Location</h4>
        <p>Dhaka, Bangladesh</p>
      </div>
    </div>

    <div class="contact-form">
      <h3>Send Us A Message</h3>
      <form onsubmit="event.preventDefault(); alert('Thank you for reaching out! We will contact you soon.'); this.reset();">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label>Your Phone / Email</label>
          <input type="text" placeholder="How can we contact you?" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="4" placeholder="Type your message here..." required></textarea>
        </div>
        <button type="submit" class="send-btn">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
