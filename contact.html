<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | VAYNRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f3f0f9; color: #2d2342; padding: 20px; }
    
    /* Navigation Bar */
    nav { max-width: 1200px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1d9ec; padding-bottom: 20px; }
    nav .logo { font-size: 26px; font-weight: 700; color: #7c5295; letter-spacing: 3px; text-decoration: none; }
    nav .nav-links { display: flex; gap: 20px; align-items: center; }
    nav .nav-links a { color: #5a4b73; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    nav .nav-links a:hover, nav .nav-links a.active { color: #8e52bd; }
    nav a.back-btn { background: #8e52bd; color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 14px; transition: 0.3s; font-weight: 600; box-shadow: 0 4px 12px rgba(142, 82, 189, 0.2); }
    nav a.back-btn:hover { background: #763fa2; }

    /* Contact Card Container */
    .contact-container { max-width: 600px; margin: 40px auto; background: #ffffff; border: 1px solid #e1d9ec; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .page-title { font-size: 28px; font-weight: 700; color: #2d2342; text-align: center; margin-bottom: 10px; }
    .page-subtitle { font-size: 14px; color: #6b5b85; text-align: center; margin-bottom: 30px; }

    .contact-info-list { margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
    .info-item { display: flex; align-items: center; gap: 15px; background: #f8f5fc; padding: 15px 20px; border-radius: 12px; border: 1px solid #e9e2f3; }
    .info-item span.icon { font-size: 22px; }
    .info-item div .label { font-size: 12px; color: #7d6e93; text-transform: uppercase; font-weight: 600; }
    .info-item div .val { font-size: 15px; font-weight: 700; color: #2d2342; text-decoration: none; }
    .info-item div a.val:hover { color: #8e52bd; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">VAYNRO</a>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html" class="active">Contact Us</a>
      <a href="index.html" class="back-btn">← Back to Shop</a>
    </div>
  </nav>

  <div class="contact-container">
    <div class="page-title">Get In Touch</div>
    <div class="page-subtitle">Have questions or need assistance with your order? Contact us directly!</div>

    <div class="contact-info-list">
      <div class="info-item">
        <span class="icon">📱</span>
        <div>
          <div class="label">Call / WhatsApp</div>
          <a href="https://wa.me/8801725373633" target="_blank" class="val">+880 1725-373633</a>
        </div>
      </div>

      <div class="info-item">
        <span class="icon">✉️</span>
        <div>
          <div class="label">Email Address</div>
          <a href="mailto:xshakib98@gmail.com" class="val">support@vaynro.com</a>
        </div>
      </div>

      <div class="info-item">
        <span class="icon">📍</span>
        <div>
          <div class="label">Headquarters</div>
          <div class="val">Dhaka, Bangladesh</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
