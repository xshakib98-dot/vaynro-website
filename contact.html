<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | VAYNRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f3f0f9; color: #2d2342; padding: 20px; }
    header { max-width: 1000px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1d9ec; padding-bottom: 20px; }
    h1.logo { font-size: 28px; letter-spacing: 4px; color: #7c5295; text-transform: uppercase; font-weight: 700; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: #5a4b73; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; }
    .back-btn { background: #8e52bd; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; }

    .contact-card { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .contact-title { font-size: 28px; font-weight: 700; color: #2d2342; margin-bottom: 8px; }
    .contact-sub { font-size: 14px; color: #6b5b85; margin-bottom: 30px; }
    
    .info-box { background: #f8f5fc; border: 1px solid #e1d9ec; border-radius: 12px; padding: 16px; margin-bottom: 15px; text-align: left; display: flex; align-items: center; gap: 15px; }
    .info-icon { font-size: 24px; }
    .info-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #7c5295; }
    .info-val { font-size: 15px; font-weight: 600; color: #2d2342; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <h1 class="logo">VAYNRO</h1>
    <div class="nav-links">
      <a href="about.html">ABOUT US</a>
      <a href="contact.html" style="color: #8e52bd;">CONTACT US</a>
      <a href="index.html" class="back-btn">← BACK TO SHOP</a>
    </div>
  </header>

  <div class="contact-card">
    <div class="contact-title">Get In Touch</div>
    <div class="contact-sub">Have questions or need assistance with your order? Contact us directly!</div>

    <div class="info-box">
      <span class="info-icon">📱</span>
      <div>
        <div class="info-label">Call / WhatsApp</div>
        <div class="info-val" id="cntPhone">+880 1725-373633</div>
      </div>
    </div>

    <div class="info-box">
      <span class="info-icon">✉️</span>
      <div>
        <div class="info-label">Email Address</div>
        <div class="info-val" id="cntEmail">support@vaynro.com</div>
      </div>
    </div>

    <div class="info-box">
      <span class="info-icon">📍</span>
      <div>
        <div class="info-label">Headquarters</div>
        <div class="info-val" id="cntAddress">Dhaka, Bangladesh</div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // অ্যাডমিন প্যানেলের site_settings/contact থেকে রিয়েল-টাইম ডাটা লোড করা
    db.collection("site_settings").doc("contact").onSnapshot(doc => {
      if(doc.exists) {
        const data = doc.data();
        if(data.phone) document.getElementById("cntPhone").innerText = data.phone;
        if(data.email) document.getElementById("cntEmail").innerText = data.email;
        if(data.address) document.getElementById("cntAddress").innerText = data.address;
      }
    });
  </script>
</body>
</html>
