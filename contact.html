<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | VAYNRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f3f0f9; color: #2d2342; padding: 20px; }
    
    nav { max-width: 1200px; margin: 0 auto 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1d9ec; padding-bottom: 20px; }
    nav .logo { font-size: 26px; font-weight: 700; color: #7c5295; letter-spacing: 3px; text-decoration: none; }
    nav .nav-links { display: flex; gap: 20px; align-items: center; }
    nav .nav-links a { color: #5a4b73; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    nav a.back-btn { background: #8e52bd; color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; }

    .contact-container { max-width: 600px; margin: 40px auto; background: #ffffff; border: 1px solid #e1d9ec; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .page-title { font-size: 28px; font-weight: 700; color: #2d2342; text-align: center; margin-bottom: 10px; }
    .page-subtitle { font-size: 14px; color: #6b5b85; text-align: center; margin-bottom: 30px; }

    .contact-info-list { margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
    .info-item { display: flex; align-items: center; gap: 15px; background: #f8f5fc; padding: 15px 20px; border-radius: 12px; border: 1px solid #e9e2f3; }
    .info-item span.icon { font-size: 22px; }
    .info-item div .label { font-size: 12px; color: #7d6e93; text-transform: uppercase; font-weight: 600; }
    .info-item div .val { font-size: 15px; font-weight: 700; color: #2d2342; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">VAYNRO</a>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html" style="color: #8e52bd;">Contact Us</a>
      <a href="index.html" class="back-btn">← Back to Shop</a>
    </div>
  </nav>

  <div class="contact-container">
    <div class="page-title">Get In Touch</div>
    <div class="page-subtitle">Have questions or need assistance with your order? Contact us directly!</div>

    <div class="contact-info-list">
      <div class="info-item">
        <span class="icon">📱</span>
        <div>
          <div class="label">Call / WhatsApp</div>
          <a id="cPhoneLink" href="#" target="_blank" class="val"><span id="cPhone">Loading...</span></a>
        </div>
      </div>

      <div class="info-item">
        <span class="icon">✉️</span>
        <div>
          <div class="label">Email Address</div>
          <a id="cEmailLink" href="#" class="val"><span id="cEmail">Loading...</span></a>
        </div>
      </div>

      <div class="info-item">
        <span class="icon">📍</span>
        <div>
          <div class="label">Headquarters</div>
          <div class="val" id="cAddress">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("site_settings").doc("contact").onSnapshot(doc => {
      if(doc.exists) {
        const d = doc.data();
        const rawPhone = (d.phone || "").replace(/[^0-9]/g, '');
        
        document.getElementById("cPhone").innerText = d.phone || "";
        document.getElementById("cPhoneLink").href = `https://wa.me/${rawPhone}`;
        
        document.getElementById("cEmail").innerText = d.email || "";
        document.getElementById("cEmailLink").href = `mailto:${d.email}`;
        
        document.getElementById("cAddress").innerText = d.address || "";
      }
    });
  </script>
</body>
</html>
