<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0f0f0f; color: #f3f4f6; padding: 30px; }
    .admin-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
    
    .card { background: #18181b; padding: 25px; border-radius: 20px; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { font-size: 18px; color: #fbbf24; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; font-weight: 700; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 11px; color: #a1a1aa; margin-bottom: 6px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    input, textarea, select { width: 100%; padding: 14px; background: #202024; border: 1px solid #3f3f46; color: #fff; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus, select:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1); }
    
    button { width: 100%; padding: 14px; background: #fbbf24; color: #18181b; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.2s; letter-spacing: 0.5px; }
    button:hover { background: #f59e0b; transform: translateY(-1px); }
    
    .img-tab-btn { background: #202024; color: #a1a1aa; border: 1px solid #3f3f46; padding: 10px; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; flex: 1; margin-top: 0; text-transform: none; transition: 0.2s; }
    .img-tab-btn.active { background: #fbbf24; color: #18181b; border-color: #fbbf24; }
    
    #dropZone { border: 2px dashed #3f3f46; padding: 25px; text-align: center; border-radius: 12px; background: #202024; cursor: pointer; position: relative; transition: 0.2s; }
    #dropZone:hover { border-color: #fbbf24; }

    .product-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; background: #202024; padding: 14px 18px; border-radius: 12px; flex-wrap: wrap; gap: 10px; border: 1px solid #27272a; }
    .btn-group { display: flex; gap: 8px; }
    
    .stock-btn { background: #d97706; color: #fff; width: auto; padding: 6px 12px; font-size: 11px; margin-top: 0; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .stock-btn.in-stock { background: #059669; }
    .delete-btn { background: #dc2626; color: #fff; width: auto; padding: 6px 12px; font-size: 11px; margin-top: 0; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    
    .thumb-preview-box { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .thumb-item { position: relative; width: 65px; height: 65px; border-radius: 8px; overflow: hidden; border: 1px solid #3f3f46; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-remove { position: absolute; top: 3px; right: 3px; background: rgba(220, 38, 38, 0.9); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Custom Stylish Modal / Toast Popup */
    #uploadPopup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .popup-box { background: #18181b; border: 1px solid #3f3f46; padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .spinner { width: 45px; height: 45px; border: 4px solid #3f3f46; border-top: 4px solid #fbbf24; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Live Upload Progress Popup -->
  <div id="uploadPopup">
    <div class="popup-box">
      <div class="spinner"></div>
      <h3 id="popupTitle" style="color: #fbbf24; font-size: 16px; margin-bottom: 8px; font-weight: 700;">Uploading Images...</h3>
      <p id="popupProgressText" style="font-size: 13px; color: #a1a1aa; margin-bottom: 15px;">0% completed</p>
      <div style="background: #202024; border-radius: 10px; height: 8px; overflow: hidden; border: 1px solid #3f3f46;">
        <div id="popupProgressBar" style="background: #fbbf24; width: 0%; height: 100%; transition: width 0.2s;"></div>
      </div>
    </div>
  </div>

  <div class="admin-container">
    
    <div class="card">
      <h2>Product Uploader</h2>
      <div class="form-group">
        <label>Product Title</label>
        <input type="text" id="pTitle" placeholder="e.g. VAYNRO Premium Jacket">
      </div>
      <div class="form-group">
        <label>Price (BDT)</label>
        <input type="number" id="pPrice" placeholder="e.g. 2500">
      </div>

      <div class="form-group">
        <label>Product Images (Add Pictures)</label>
        
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
          <button type="button" class="img-tab-btn active" onclick="switchImageTab('file')">📁 Browse Files</button>
          <button type="button" class="img-tab-btn" onclick="switchImageTab('url')">🔗 Image URLs</button>
        </div>

        <div id="fileUploadTab">
          <div id="dropZone">
            <input type="file" id="productImageFile" accept="image/*" multiple style="position: absolute; inset: 0; opacity: 0; cursor: pointer;" onchange="handleFileSelect(this)">
            <div id="dropText">
              <p style="font-size: 13px; font-weight: 600; color: #fff;">Drag & drop multiple images here</p>
              <p style="font-size: 11px; color: #a1a1aa; margin-top: 4px;">or <span style="color: #fbbf24; text-decoration: underline;">Browse from device</span></p>
            </div>
          </div>
        </div>

        <div id="urlUploadTab" style="display: none;">
          <input type="text" id="pImgUrlInput" placeholder="Paste image link and click Add">
          <button type="button" onclick="addImageUrlToList()" style="background: #27272a; color: #fbbf24; margin-top: 8px; padding: 10px;">+ Add Image Link</button>
        </div>

        <div id="imagePreviewContainer" style="display: none;">
          <label style="margin-top: 12px; font-size: 11px; color: #fbbf24;">Selected Gallery Preview:</label>
          <div class="thumb-preview-box" id="thumbPreviewList"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Product Category</label>
        <select id="pCategory">
          <option value="tshirt">T-Shirt</option>
          <option value="hoodie">Hoodie</option>
          <option value="shirt">Shirt</option>
          <option value="pants">Pants</option>
          <option value="shoe">Shoe</option>
          <option value="bag">Bag</option>
        </select>
      </div>
      <button id="publishBtn" onclick="uploadProduct()">Publish Product</button>
    </div>

    <div class="card">
      <h2>Existing Products & Stock Control</h2>
      <div class="product-list" id="pList">Loading products...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    let productFilesArray = [];

    function switchImageTab(type) {
      const fileTab = document.getElementById("fileUploadTab");
      const urlTab = document.getElementById("urlUploadTab");
      const btns = document.querySelectorAll(".img-tab-btn");

      btns.forEach(b => b.classList.remove("active"));
      
      if(type === 'file') {
        fileTab.style.display = "block";
        urlTab.style.display = "none";
        btns[0].classList.add("active");
      } else {
        fileTab.style.display = "none";
        urlTab.style.display = "block";
        btns[1].classList.add("active");
      }
    }

    function handleFileSelect(input) {
      if (input.files && input.files.length > 0) {
        Array.from(input.files).forEach(file => {
          if (file.type.startsWith('image/')) {
            productFilesArray.push(file);
          }
        });
        renderImagePreviews();
      }
    }

    function addImageUrlToList() {
      const urlInput = document.getElementById("pImgUrlInput");
      const url = urlInput.value.trim();
      if(url) {
        productFilesArray.push(url);
        urlInput.value = "";
        renderImagePreviews();
      } else {
        alert("Please enter a valid image URL.");
      }
    }

    function renderImagePreviews() {
      const container = document.getElementById("imagePreviewContainer");
      const list = document.getElementById("thumbPreviewList");
      list.innerHTML = "";

      if(productFilesArray.length > 0) {
        container.style.display = "block";
        productFilesArray.forEach((item, index) => {
          let imgSrc = typeof item === 'string' ? item : URL.createObjectURL(item);
          list.innerHTML += `
            <div class="thumb-item">
              <img src="${imgSrc}" alt="thumb">
              <button class="thumb-remove" onclick="removeImage(${index})">&times;</button>
            </div>
          `;
        });
      } else {
        container.style.display = "none";
      }
    }

    function removeImage(index) {
      productFilesArray.splice(index, 1);
      renderImagePreviews();
    }

    // Upload Product with Live Progress & Detailed Error Handling
    async function uploadProduct() {
      const title = document.getElementById("pTitle").value.trim();
      const price = Number(document.getElementById("pPrice").value);
      const category = document.getElementById("pCategory").value;

      if(!title || !price) {
        alert("Please fill title and price!");
        return;
      }

      if(productFilesArray.length === 0) {
        alert("Please add at least one product image!");
        return;
      }

      const popup = document.getElementById("uploadPopup");
      const progressBar = document.getElementById("popupProgressBar");
      const progressText = document.getElementById("popupProgressText");
      const popupTitle = document.getElementById("popupTitle");
      
      popup.style.display = "flex";
      progressBar.style.width = "0%";
      progressText.innerText = "Initializing upload...";
      popupTitle.innerText = "Uploading Product...";

      try {
        let uploadedImageUrls = [];
        let totalItems = productFilesArray.length;
        let completedCount = 0;

        for (let i = 0; i < totalItems; i++) {
          let item = productFilesArray[i];
          
          if (typeof item === 'string') {
            uploadedImageUrls.push(item);
            completedCount++;
            let percent = Math.round((completedCount / totalItems) * 100);
            progressBar.style.width = percent + "%";
            progressText.innerText = `${percent}% completed (${completedCount}/${totalItems})`;
          } else {
            const fileName = `products/${Date.now()}_${item.name}`;
            const storageRef = storage.ref().child(fileName);
            
            // Using put() with snapshot listener for accurate percentage
            const uploadTask = storageRef.put(item);
            
            await new Promise((resolve, reject) => {
              uploadTask.on('state_changed', 
                (snapshot) => {
                  let fileProgress = (snapshot.bytesTransferred / snapshot.totalBytes);
                  let overallPercent = Math.round(((completedCount + fileProgress) / totalItems) * 100);
                  progressBar.style.width = overallPercent + "%";
                  progressText.innerText = `Uploading image ${i + 1} of ${totalItems} (${overallPercent}%)`;
                }, 
                (error) => {
                  reject(error);
                }, 
                async () => {
                  const downloadUrl = await uploadTask.snapshot.ref.getDownloadURL();
                  uploadedImageUrls.push(downloadUrl);
                  completedCount++;
                  resolve();
                }
              );
            });
          }
        }

        progressText.innerText = "Saving to database...";
        const mainImage = uploadedImageUrls[0];

        await db.collection("products").add({ 
          title, 
          price, 
          image: mainImage,
          images: uploadedImageUrls,
          category,
          inStock: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp() 
        });

        popup.style.display = "none";
        alert("Product Added Successfully!");
        
        // Reset form
        document.getElementById("pTitle").value = "";
        document.getElementById("pPrice").value = "";
        document.getElementById("productImageFile").value = "";
        document.getElementById("pImgUrlInput").value = "";
        productFilesArray = [];
        renderImagePreviews();
        document.getElementById("pCategory").value = "tshirt";

      } catch (error) {
        popup.style.display = "none";
        console.error("Upload Error:", error);
        alert("Upload Failed! Error: " + error.message + "\n\nTip: Check if your Firebase Storage Rules allow write access.");
      }
    }

    db.collection("products").onSnapshot(snapshot => {
      const list = document.getElementById("pList");
      if (!list) return;
      list.innerHTML = "";
      if(snapshot.empty) {
        list.innerHTML = "<p style='color: #71717a; text-align: center; font-size: 13px;'>No products found.</p>";
        return;
      }
      snapshot.forEach(doc => {
        const d = doc.data();
        const inStock = d.inStock !== false;
        const imgCount = d.images ? d.images.length : 1;
        list.innerHTML += `
          <div class="product-item">
            <div><b>${d.title}</b> - ${d.price} BDT <span style="font-size:11px; color:#fbbf24; margin-left:6px;">[${d.category || 'general'}] (${imgCount} imgs)</span></div>
            <div class="btn-group">
              <button class="stock-btn ${inStock ? 'in-stock' : ''}" onclick="toggleStock('${doc.id}', ${inStock})">
                ${inStock ? 'In Stock' : 'Stock Out'}
              </button>
              <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>
          </div>
        `;
      });
    });

    function toggleStock(id, currentStatus) {
      db.collection("products").doc(id).update({
        inStock: !currentStatus
      });
    }

    function deleteProduct(id) {
      if(confirm("Delete this product?")) {
        db.collection("products").doc(id).delete();
      }
    }
  </script>
</body>
</html>
