<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0b0b; color: #fff; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    .admin-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; margin-bottom: 40px; }
    h2 { font-size: 22px; color: #d4af37; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; text-transform: uppercase; color: #a0a0a0; margin-bottom: 8px; letter-spacing: 1px; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222; background: #0b0b0b; color: #fff; font-size: 14px; outline: none;
    }
    input:focus { border-color: #d4af37; }
    .submit-btn { width: 100%; background: #d4af37; color: #000; padding: 14px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
    .submit-btn:hover { background: #fff; }
    .status-msg { margin-top: 15px; font-size: 13px; text-align: center; color: #d4af37; }
    
    /* Manage Products List */
    .manage-section { width: 100%; max-width: 500px; background: #141414; border: 1px solid #222; border-radius: 12px; padding: 20px; }
    .manage-title { font-size: 18px; color: #d4af37; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
    .product-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    .product-info { display: flex; align-items: center; gap: 12px; }
    .product-info img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
    .delete-btn { background: #ff4d4d; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .delete-btn:hover { background: #cc0000; }
  </style>
</head>
<body>

  <!-- Product Upload Form -->
  <div class="admin-card">
    <h2>VAYNRO Product Uploader</h2>
    <form id="uploadForm" onsubmit="uploadProduct(event)">
      <div class="form-group">
        <label>Product Title</label>
        <input type="text" id="prodTitle" placeholder="e.g. VAYNRO Premium Jacket" required>
      </div>
      <div class="form-group">
        <label>Price (BDT)</label>
        <input type="number" id="prodPrice" placeholder="e.g. 2500" required>
      </div>
      <div class="form-group">
        <label>Image Name / URL</label>
        <input type="text" id="prodImage" placeholder="e.g. image link" required>
      </div>
      <button type="submit" class="submit-btn" id="uploadBtn">Publish Product</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <!-- Manage Existing Products -->
  <div class="manage-section">
    <div class="manage-title">Existing Products</div>
    <div id="productList">
      <p style="text-align:center; color:#888;">Loading products...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Upload Product
    function uploadProduct(e) {
      e.preventDefault();

      const title = document.getElementById("prodTitle").value;
      const price = parseFloat(document.getElementById("prodPrice").value);
      const image = document.getElementById("prodImage").value;
      const btn = document.getElementById("uploadBtn");
      const status = document.getElementById("statusMsg");

      btn.disabled = true;
      btn.innerText = "Publishing...";

      db.collection("products").add({
        title: title,
        price: price,
        image: image,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        status.innerText = "✅ Product Published Successfully!";
        document.getElementById("uploadForm").reset();
      }).catch((err) => {
        status.innerText = "❌ Failed: " + err.message;
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Publish Product";
      });
    }

    // Load Live Products with Delete Button
    db.collection("products").onSnapshot((snapshot) => {
      const list = document.getElementById("productList");
      list.innerHTML = "";

      if(snapshot.empty) {
        list.innerHTML = "<p style='text-align:center; color:#888;'>No products found.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        list.innerHTML += `
          <div class="product-item">
            <div class="product-info">
              <img src="${data.image}" onerror="this.src='https://via.placeholder.com/45'">
              <div>
                <div style="font-weight:600; font-size:14px;">${data.title}</div>
                <div style="color:#d4af37; font-size:12px;">${data.price} BDT</div>
              </div>
            </div>
            <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
          </div>
        `;
      });
    });

    // Delete Product Function
    function deleteProduct(docId) {
      if(confirm("Are you sure you want to delete this product?")) {
        db.collection("products").doc(docId).delete().then(() => {
          alert("🗑️ Product Deleted!");
        }).catch((err) => {
          alert("Error: " + err.message);
        });
      }
    }
  </script>
</body>
</html>
