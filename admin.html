<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0b0b; color: #fff; padding: 40px 20px; display: flex; justify-content: center; }
    .admin-card { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; }
    h2 { font-size: 22px; color: #d4af37; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; text-transform: uppercase; color: #a0a0a0; margin-bottom: 8px; letter-spacing: 1px; }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222; background: #0b0b0b; color: #fff; font-size: 14px; outline: none;
    }
    input:focus { border-color: #d4af37; }
    .submit-btn { width: 100%; background: #d4af37; color: #000; padding: 14px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
    .submit-btn:hover { background: #fff; }
    .status-msg { margin-top: 15px; font-size: 13px; text-align: center; color: #d4af37; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>VAYNRO Product Uploader</h2>
    <form id="uploadForm" onsubmit="uploadProduct(event)">
      <div class="form-group">
        <label>Product Title</label>
        <input type="text" id="prodTitle" placeholder="e.g. VAYNRO Premium Jacket" required>
      </div>
      <div class="form-group">
        <label>Price (BDT)</label>
        <input type="number" id="prodPrice" placeholder="e.g. 2500" required>
      </div>
      <div class="form-group">
        <label>Product Image</label>
        <input type="file" id="prodImage" accept="image/*" required>
      </div>
      <button type="submit" class="submit-btn" id="uploadBtn">Upload Product</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    function uploadProduct(e) {
      e.preventDefault();

      const title = document.getElementById("prodTitle").value;
      const price = parseFloat(document.getElementById("prodPrice").value);
      const file = document.getElementById("prodImage").files[0];
      const btn = document.getElementById("uploadBtn");
      const status = document.getElementById("statusMsg");

      if (!file) return;

      btn.disabled = true;
      btn.innerText = "Uploading Image...";
      status.innerText = "Please wait, uploading to server...";

      // Upload image to Firebase Storage
      const storageRef = storage.ref('products/' + Date.now() + '_' + file.name);
      storageRef.put(file).then((snapshot) => {
        return snapshot.ref.getDownloadURL();
      }).then((downloadURL) => {
        btn.innerText = "Saving Product...";
        
        // Save product details to Firestore Database
        return db.collection("products").add({
          title: title,
          price: price,
          image: downloadURL,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).then(() => {
        status.innerText = "✅ Product uploaded successfully!";
        document.getElementById("uploadForm").reset();
      }).catch((err) => {
        console.error(err);
        status.innerText = "❌ Failed to upload. Check Firebase rules.";
      }).finally(() => {
        btn.disabled = false;
        btn.innerText = "Upload Product";
      });
    }
  </script>
</body>
</html>
