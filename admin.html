<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #121212; color: #ffffff; padding: 30px; }
    .admin-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 16px; border: 1px solid #333; }
    h2 { font-size: 20px; color: #e5b869; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; outline: none; }
    button { width: 100%; padding: 12px; background: #e5b869; color: #121212; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
    button:hover { background: #d4a555; }
    
    .img-tab-btn { background: #2a2a2a; color: #aaa; border: 1px solid #444; padding: 8px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; flex: 1; margin-top: 0; text-transform: none; transition: 0.2s; }
    .img-tab-btn.active { background: #e5b869; color: #121212; border-color: #e5b869; }
    #dropZone { border: 2px dashed #555; padding: 20px; text-align: center; border-radius: 8px; background: #2a2a2a; cursor: pointer; position: relative; transition: 0.2s; }
    #dropZone:hover { border-color: #e5b869; }

    .product-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .product-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
    .btn-group { display: flex; gap: 8px; }
    .stock-btn { background: #f39c12; color: #fff; width: auto; padding: 6px 12px; font-size: 12px; margin-top: 0; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .stock-btn.in-stock { background: #27ae60; }
    .delete-btn { background: #e74c3c; color: #fff; width: auto; padding: 6px 12px; font-size: 12px; margin-top: 0; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
    
    .thumb-preview-box { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .thumb-item { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-remove { position: absolute; top: 2px; right: 2px; background: rgba(231,76,60,0.8); color: #fff; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div class="card">
      <h2>Product Uploader</h2>
      <div class="form-group">
        <label>Product Title</label>
        <input type="text" id="pTitle" placeholder="e.g. VAYNRO Premium Jacket">
      </div>
      <div class="form-group">
        <label>Price (BDT)</label>
        <input type="number" id="pPrice" placeholder="e.g. 2500">
      </div>

      <!-- Multiple Image Source Section -->
      <div class="form-group">
        <label>Product Images (Add 4-5 Pictures)</label>
        
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <button type="button" class="img-tab-btn active" onclick="switchImageTab('file')">📁 Browse Files</button>
          <button type="button" class="img-tab-btn" onclick="switchImageTab('url')">🔗 Image URLs</button>
        </div>

        <!-- Option 1: File Browse & Drag & Drop -->
        <div id="fileUploadTab">
          <div id="dropZone">
            <input type="file" id="productImageFile" accept="image/*" multiple style="position: absolute; inset: 0; opacity: 0; cursor: pointer;" onchange="handleFileSelect(this)">
            <div id="dropText">
              <p style="font-size: 13px; font-weight: 600; color: #fff;">Drag & drop multiple images here</p>
              <p style="font-size: 11px; color: #aaa; margin-top: 4px;">or <span style="color: #e5b869; text-decoration: underline;">Browse from device (Select multiple)</span></p>
            </div>
          </div>
        </div>

        <!-- Option 2: Image URL -->
        <div id="urlUploadTab" style="display: none;">
          <input type="text" id="pImgUrlInput" placeholder="Paste image link and click Add">
          <button type="button" onclick="addImageUrlToList()" style="background: #333; color: #e5b869; margin-top: 6px; padding: 8px;">+ Add Image Link</button>
        </div>

        <!-- Multiple Images Preview Grid -->
        <div id="imagePreviewContainer" style="display: none;">
          <label style="margin-top: 10px; font-size: 11px; color: #e5b869;">Selected Images Gallery Preview:</label>
          <div class="thumb-preview-box" id="thumbPreviewList"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Product Category</label>
        <select id="pCategory">
          <option value="tshirt">T-Shirt</option>
          <option value="hoodie">Hoodie</option>
          <option value="shirt">Shirt</option>
          <option value="pants">Pants</option>
          <option value="shoe">Shoe</option>
          <option value="bag">Bag</option>
        </select>
      </div>
      <button onclick="uploadProduct()">Publish Product</button>
    </div>

    <div class="card">
      <h2>Existing Products & Stock Control</h2>
      <div class="product-list" id="pList">Loading...</div>
    </div>

    <div class="card">
      <h2>Manage About Us Page</h2>
      <div class="form-group">
        <label>Founder Name</label>
        <input type="text" id="abName" placeholder="e.g. Shakib">
      </div>
      <div class="form-group">
        <label>Role / Title</label>
        <input type="text" id="abRole" placeholder="e.g. Founder & CEO, VAYNRO">
      </div>
      <div class="form-group">
        <label>Founder Image URL</label>
        <input type="text" id="abImg" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Bio Paragraph 1</label>
        <textarea id="abBio1" rows="3" placeholder="Welcome text..."></textarea>
      </div>
      <div class="form-group">
        <label>Bio Paragraph 2</label>
        <textarea id="abBio2" rows="3" placeholder="Mission details..."></textarea>
      </div>
      <button onclick="saveAboutSettings()">Save About Us Info</button>
    </div>

    <div class="card">
      <h2>Manage Contact Us Page</h2>
      <div class="form-group">
        <label>Phone / WhatsApp Number</label>
        <input type="text" id="ctPhone" placeholder="e.g. +880 1725-373633">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="ctEmail" placeholder="e.g. support@vaynro.com">
      </div>
      <div class="form-group">
        <label>Headquarters / Address</label>
        <input type="text" id="ctAddress" placeholder="e.g. Dhaka, Bangladesh">
      </div>
      <button onclick="saveContactSettings()">Save Contact Info</button>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let productImagesArray = []; // Stores multiple image strings (Base64 or URLs)

    function switchImageTab(type) {
      const fileTab = document.getElementById("fileUploadTab");
      const urlTab = document.getElementById("urlUploadTab");
      const btns = document.querySelectorAll(".img-tab-btn");

      btns.forEach(b => b.classList.remove("active"));
      
      if(type === 'file') {
        fileTab.style.display = "block";
        urlTab.style.display = "none";
        btns[0].classList.add("active");
      } else {
        fileTab.style.display = "none";
        urlTab.style.display = "block";
        btns[1].classList.add("active");
      }
    }

    // Handle Multiple File Selection
    function handleFileSelect(input) {
      if (input.files && input.files.length > 0) {
        Array.from(input.files).forEach(file => {
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
              productImagesArray.push(e.target.result);
              renderImagePreviews();
            }
            reader.readAsDataURL(file);
          }
        });
      }
    }

    // Add Image via URL to List
    function addImageUrlToList() {
      const urlInput = document.getElementById("pImgUrlInput");
      const url = urlInput.value.trim();
      if(url) {
        productImagesArray.push(url);
        urlInput.value = "";
        renderImagePreviews();
      } else {
        alert("Please enter a valid image URL.");
      }
    }

    // Render Preview Thumbnails
    function renderImagePreviews() {
      const container = document.getElementById("imagePreviewContainer");
      const list = document.getElementById("thumbPreviewList");
      list.innerHTML = "";

      if(productImagesArray.length > 0) {
        container.style.display = "block";
        productImagesArray.forEach((imgSrc, index) => {
          list.innerHTML += `
            <div class="thumb-item">
              <img src="${imgSrc}" alt="thumb">
              <button class="thumb-remove" onclick="removeImage(${index})">&times;</button>
            </div>
          `;
        });
      } else {
        container.style.display = "none";
      }
    }

    // Remove Image from List
    function removeImage(index) {
      productImagesArray.splice(index, 1);
      renderImagePreviews();
    }

    // Product Upload Function with Multiple Images Array
    function uploadProduct() {
      const title = document.getElementById("pTitle").value.trim();
      const price = Number(document.getElementById("pPrice").value);
      const category = document.getElementById("pCategory").value;

      if(!title || !price) {
        alert("Please fill title and price!");
        return;
      }

      if(productImagesArray.length === 0) {
        alert("Please add at least one product image!");
        return;
      }

      // Main image field for backward compatibility + images array for gallery
      const mainImage = productImagesArray[0];

      db.collection("products").add({ 
        title, 
        price, 
        image: mainImage,
        images: productImagesArray, // Saving full array of 4-5 images
        category,
        inStock: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp() 
      })
      .then(() => {
        alert("Product Added Successfully with Multiple Images!");
        document.getElementById("pTitle").value = "";
        document.getElementById("pPrice").value = "";
        document.getElementById("productImageFile").value = "";
        document.getElementById("pImgUrlInput").value = "";
        productImagesArray = [];
        renderImagePreviews();
        document.getElementById("pCategory").value = "tshirt";
      })
      .catch((error) => {
        alert("Error adding product: " + error.message);
      });
    }

    // Load Existing Products
    db.collection("products").onSnapshot(snapshot => {
      const list = document.getElementById("pList");
      if (!list) return;
      list.innerHTML = "";
      if(snapshot.empty) {
        list.innerHTML = "<p style='color: #aaa; text-align: center; font-size: 13px;'>No products found.</p>";
        return;
      }
      snapshot.forEach(doc => {
        const d = doc.data();
        const inStock = d.inStock !== false;
        const imgCount = d.images ? d.images.length : 1;
        list.innerHTML += `
          <div class="product-item">
            <div><b>${d.title}</b> - ${d.price} BDT <span style="font-size:11px; color:#e5b869; margin-left:8px;">[${d.category || 'general'}] (${imgCount} imgs)</span></div>
            <div class="btn-group">
              <button class="stock-btn ${inStock ? 'in-stock' : ''}" onclick="toggleStock('${doc.id}', ${inStock})">
                ${inStock ? 'In Stock' : 'Stock Out'}
              </button>
              <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
            </div>
          </div>
        `;
      });
    });

    function toggleStock(id, currentStatus) {
      db.collection("products").doc(id).update({
        inStock: !currentStatus
      });
    }

    function deleteProduct(id) {
      if(confirm("Delete this product?")) {
        db.collection("products").doc(id).delete();
      }
    }

    // Site Settings Loaders & Savers
    db.collection("site_settings").doc("about").get().then(doc => {
      if(doc.exists) {
        const d = doc.data();
        document.getElementById("abName").value = d.name || "";
        document.getElementById("abRole").value = d.role || "";
        document.getElementById("abImg").value = d.img || "";
        document.getElementById("abBio1").value = d.bio1 || "";
        document.getElementById("abBio2").value = d.bio2 || "";
      }
    });

    db.collection("site_settings").doc("contact").get().then(doc => {
      if(doc.exists) {
        const d = doc.data();
        document.getElementById("ctPhone").value = d.phone || "";
        document.getElementById("ctEmail").value = d.email || "";
        document.getElementById("ctAddress").value = d.address || "";
      }
    });

    function saveAboutSettings() {
      db.collection("site_settings").doc("about").set({
        name: document.getElementById("abName").value,
        role: document.getElementById("abRole").value,
        img: document.getElementById("abImg").value,
        bio1: document.getElementById("abBio12") ? document.getElementById("abBio12").value : document.getElementById("abBio1").value,
        bio2: document.getElementById("abBio2").value
      }).then(() => alert("About Us info updated successfully!"));
    }

    function saveContactSettings() {
      db.collection("site_settings").doc("contact").set({
        phone: document.getElementById("ctPhone").value,
        email: document.getElementById("ctEmail").value,
        address: document.getElementById("ctAddress").value
      }).then(() => alert("Contact info updated successfully!"));
    }
  </script>
</body>
</html>
