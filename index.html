<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Aesthetic Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0b0b; color: #fff; padding: 40px 20px; }
    header { text-align: center; padding-bottom: 30px; border-bottom: 1px solid #222; }
    h1 { font-size: 32px; letter-spacing: 4px; color: #d4af37; text-transform: uppercase; }
    
    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; }
    .card { background: #141414; border: 1px solid #222; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 350px; object-fit: cover; background: #1a1a1a; }
    .card-details { padding: 20px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 18px; color: #fff; margin-bottom: 8px; font-weight: 600; }
    .card-price { font-size: 16px; color: #d4af37; font-weight: 700; margin-bottom: 15px; }
    .buy-btn { background: #d4af37; color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
    .buy-btn:hover { background: #fff; }

    /* Order Modal (Popup) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #141414; border: 1px solid #d4af37; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; color: #aaa; font-size: 24px; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    .modal-title { font-size: 20px; color: #d4af37; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
    
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #d4af37; }
    
    .confirm-btn { width: 100%; background: #d4af37; color: #000; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-top: 10px; transition: 0.3s; }
    .confirm-btn:hover { background: #fff; }
    .status-msg { margin-top: 10px; font-size: 13px; text-align: center; color: #25d366; }
  </style>
</head>
<body>

  <header>
    <h1>VAYNRO</h1>
  </header>

  <div class="product-grid" id="productGrid">
    <p style="text-align: center; width: 100%; color: #888;">Loading catalog...</p>
  </div>

  <!-- Checkout Modal Popup -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-title">Checkout Order</div>
      
      <form id="orderForm" onsubmit="placeOrder(event)">
        <div class="form-group">
          <label>Selected Product</label>
          <input type="text" id="modalProduct" readonly style="color: #d4af37; font-weight: bold;">
        </div>

        <div class="form-group">
          <label>Select Size</label>
          <select id="custSize" required>
            <option value="">Choose Size</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" placeholder="017XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label>Full Delivery Address</label>
          <textarea id="custAddress" rows="2" placeholder="House/Road, Area, City" required></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <select id="payMethod" required>
            <option value="Cash on Delivery">Cash on Delivery (COD)</option>
            <option value="bKash">bKash</option>
            <option value="Nagad">Nagad</option>
          </select>
        </div>

        <button type="submit" class="confirm-btn" id="subBtn">Confirm Order</button>
        <div class="status-msg" id="orderStatus"></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let selectedProductTitle = "";
    let selectedProductPrice = "";

    // Fetch live products from Firestore
    db.collection("products").onSnapshot((snapshot) => {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if(snapshot.empty) {
        grid.innerHTML = "<p style='text-align:center; width:100%; color:#888;'>No products available right now.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        grid.innerHTML += `
          <div class="card">
            <img src="${data.image}" alt="${data.title}" referrerpolicy="no-referrer" onerror="this.src='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500'">
            <div class="card-details">
              <div>
                <div class="card-title">${data.title || 'VAYNRO Apparel'}</div>
                <div class="card-price">${data.price || 0} BDT</div>
              </div>
              <button class="buy-btn" onclick="openModal('${data.title}', '${data.price}')">Buy Now</button>
            </div>
          </div>
        `;
      });
    });

    // Open Modal
    function openModal(title, price) {
      selectedProductTitle = title;
      selectedProductPrice = price;
      document.getElementById("modalProduct").value = `${title} - ${price} BDT`;
      document.getElementById("orderModal").style.display = "flex";
      document.getElementById("orderStatus").innerText = "";
    }

    // Close Modal
    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    // Place Order directly to Firebase Firestore
    function placeOrder(e) {
      e.preventDefault();

      const btn = document.getElementById("subBtn");
      const status = document.getElementById("orderStatus");

      btn.disabled = true;
      btn.innerText = "Processing...";

      const orderData = {
        product: selectedProductTitle,
        price: selectedProductPrice,
        size: document.getElementById("custSize").value,
        customerName: document.getElementById("custName").value,
        phone: document.getElementById("custPhone").value,
        address: document.getElementById("custAddress").value,
        paymentMethod: document.getElementById("payMethod").value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("orders").add(orderData).then(() => {
        status.innerText = "🎉 Order Placed Successfully!";
        document.getElementById("orderForm").reset();
        setTimeout(() => {
          closeModal();
          btn.disabled = false;
          btn.innerText = "Confirm Order";
        }, 2000);
      }).catch((err) => {
        console.error(err);
        status.innerText = "❌ Order Failed. Please try again.";
        btn.disabled = false;
        btn.innerText = "Confirm Order";
      });
    }
  </script>
</body>
</html>
