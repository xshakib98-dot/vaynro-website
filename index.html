<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Aesthetic Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0b0b0b; color: #fff; padding: 20px; }
    
    /* Header / Navbar */
    header { max-width: 1200px; margin: 0 auto 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; }
    h1 { font-size: 28px; letter-spacing: 4px; color: #d4af37; text-transform: uppercase; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .nav-links a:hover { color: #d4af37; }
    
    /* Cart Trigger Button */
    .cart-btn-trigger { background: #141414; border: 1px solid #d4af37; color: #d4af37; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .cart-btn-trigger:hover { background: #d4af37; color: #000; }

    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; }
    .card { background: #141414; border: 1px solid #222; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 350px; object-fit: cover; background: #1a1a1a; }
    .card-details { padding: 20px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 18px; color: #fff; margin-bottom: 8px; font-weight: 600; }
    .card-price { font-size: 16px; color: #d4af37; font-weight: 700; margin-bottom: 15px; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-group button { flex: 1; border: none; padding: 12px 5px; border-radius: 6px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.3s; }
    .add-cart-btn { background: #222; color: #fff; border: 1px solid #333 !important; }
    .add-cart-btn:hover { border-color: #d4af37 !important; color: #d4af37; }
    .buy-btn { background: #d4af37; color: #000; }
    .buy-btn:hover { background: #fff; }

    /* Modal Popups (Order & Cart Drawer) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #141414; border: 1px solid #d4af37; padding: 25px; border-radius: 12px; width: 100%; max-width: 480px; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 15px; right: 20px; color: #aaa; font-size: 24px; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    .modal-title { font-size: 20px; color: #d4af37; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
    
    /* Cart Items List */
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
    .cart-item-title { font-size: 14px; font-weight: 600; }
    .cart-item-price { color: #d4af37; font-size: 13px; }
    .remove-item { color: #ff4d4d; cursor: pointer; font-size: 18px; font-weight: bold; margin-left: 10px; }
    .cart-total-box { display: flex; justify-content: space-between; margin: 15px 0; font-size: 16px; font-weight: 700; color: #d4af37; border-top: 1px dashed #333; padding-top: 10px; }

    /* Form Styles */
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #0b0b0b; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #d4af37; }
    
    .payment-box { background: #1c1a14; border: 1px solid #d4af37; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; display: none; }
    .payment-box .num { color: #d4af37; font-weight: bold; font-size: 15px; }

    .confirm-btn { width: 100%; background: #d4af37; color: #000; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-top: 10px; transition: 0.3s; }
    .confirm-btn:hover { background: #fff; }
    .status-msg { margin-top: 10px; font-size: 13px; text-align: center; color: #25d366; }
  </style>
</head>
<body>

  <header>
    <h1>VAYNRO</h1>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <button class="cart-btn-trigger" onclick="openCartModal()">
        🛒 Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Product Catalog -->
  <div class="product-grid" id="productGrid">
    <p style="text-align: center; width: 100%; color: #888;">Loading catalog...</p>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCartModal()">&times;</span>
      <div class="modal-title">Your Shopping Cart</div>
      
      <div id="cartItemsContainer">
        <p style="text-align: center; color: #888; margin: 20px 0;">Your cart is empty.</p>
      </div>

      <div class="cart-total-box" id="cartTotalBox" style="display: none;">
        <span>Total:</span>
        <span id="cartTotalAmount">0 BDT</span>
      </div>

      <button class="confirm-btn" id="checkoutCartBtn" style="display: none;" onclick="openCheckoutFromCart()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Checkout Order Modal Popup -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-title">Checkout Order</div>
      
      <form id="orderForm" onsubmit="placeOrder(event)">
        <div class="form-group">
          <label>Selected Product(s)</label>
          <input type="text" id="modalProduct" readonly style="color: #d4af37; font-weight: bold;">
        </div>

        <div class="form-group">
          <label>Select Size</label>
          <select id="custSize" required>
            <option value="">Choose Size</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" placeholder="017XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label>Full Delivery Address</label>
          <textarea id="custAddress" rows="2" placeholder="House/Road, Area, City" required></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <select id="payMethod" onchange="togglePaymentInfo()" required>
            <option value="Cash on Delivery">Cash on Delivery (COD)</option>
            <option value="bKash">bKash (Send Money)</option>
          </select>
        </div>

        <!-- bKash Instructions & Inputs -->
        <div class="payment-box" id="bkashBox">
          <p>Please <b>Send Money</b> to this bKash Number:</p>
          <p class="num">📱 01725373633 (Personal)</p>
          <p style="font-size: 11px; color: #aaa; margin-top: 5px;">টাকা পাঠানোর পর নিচের ঘর দুটি পূরণ করুন:</p>
          
          <div class="form-group" style="margin-top: 10px;">
            <label>Sender bKash Number</label>
            <input type="tel" id="bkashSenderNum" placeholder="যে নম্বর থেকে টাকা পাঠিয়েছেন">
          </div>
          <div class="form-group">
            <label>Transaction ID (TrxID)</label>
            <input type="text" id="bkashTrxId" placeholder="e.g. 9J7X8KLMNO">
          </div>
        </div>

        <button type="submit" class="confirm-btn" id="subBtn">Confirm Order</button>
        <div class="status-msg" id="orderStatus"></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];
    let selectedProductTitle = "";
    let selectedProductPrice = "";

    // Load Live Products
    db.collection("products").onSnapshot((snapshot) => {
      const grid = document.getElementById("productGrid");
      grid.innerHTML = "";

      if(snapshot.empty) {
        grid.innerHTML = "<p style='text-align:center; width:100%; color:#888;'>No products available right now.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        grid.innerHTML += `
          <div class="card">
            <img src="${data.image}" alt="${data.title}" referrerpolicy="no-referrer" onerror="this.src='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500'">
            <div class="card-details">
              <div>
                <div class="card-title">${data.title || 'VAYNRO Apparel'}</div>
                <div class="card-price">${data.price || 0} BDT</div>
              </div>
              <div class="btn-group">
                <button class="add-cart-btn" onclick="addToCart('${data.title}', ${data.price || 0})">+ Cart</button>
                <button class="buy-btn" onclick="openDirectBuyModal('${data.title}', '${data.price}')">Buy Now</button>
              </div>
            </div>
          </div>
        `;
      });
    });

    // Cart Functionalities
    function addToCart(title, price) {
      cart.push({ title, price: Number(price) });
      updateCartUI();
      openCartModal();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById("cartCount").innerText = cart.length;
      const container = document.getElementById("cartItemsContainer");
      const totalBox = document.getElementById("cartTotalBox");
      const checkoutBtn = document.getElementById("checkoutCartBtn");

      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #888; margin: 20px 0;">Your cart is empty.</p>`;
        totalBox.style.display = "none";
        checkoutBtn.style.display = "none";
        return;
      }

      let html = "";
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        html += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-price">${item.price} BDT</div>
            </div>
            <span class="remove-item" onclick="removeFromCart(${index})">&times;</span>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById("cartTotalAmount").innerText = total + " BDT";
      totalBox.style.display = "flex";
      checkoutBtn.style.display = "block";
    }

    function openCartModal() {
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    // Modal Control & Checkout Setup
    function openDirectBuyModal(title, price) {
      selectedProductTitle = title;
      selectedProductPrice = price + " BDT";
      document.getElementById("modalProduct").value = `${selectedProductTitle} - ${selectedProductPrice}`;
      document.getElementById("orderModal").style.display = "flex";
      document.getElementById("orderStatus").innerText = "";
      togglePaymentInfo();
    }

    function openCheckoutFromCart() {
      closeCartModal();
      const titles = cart.map(i => i.title).join(", ");
      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);
      
      selectedProductTitle = `[Cart Order] ${titles}`;
      selectedProductPrice = `${totalPrice} BDT`;
      
      document.getElementById("modalProduct").value = `${selectedProductTitle} (${selectedProductPrice})`;
      document.getElementById("orderModal").style.display = "flex";
      document.getElementById("orderStatus").innerText = "";
      togglePaymentInfo();
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    function togglePaymentInfo() {
      const payMethod = document.getElementById("payMethod").value;
      const bkashBox = document.getElementById("bkashBox");
      const senderInput = document.getElementById("bkashSenderNum");
      const trxInput = document.getElementById("bkashTrxId");

      if (payMethod === "bKash") {
        bkashBox.style.display = "block";
        senderInput.required = true;
        trxInput.required = true;
      } else {
        bkashBox.style.display = "none";
        senderInput.required = false;
        trxInput.required = false;
      }
    }

    // Place Order to Firebase
    function placeOrder(e) {
      e.preventDefault();

      const btn = document.getElementById("subBtn");
      const status = document.getElementById("orderStatus");
      const payMethod = document.getElementById("payMethod").value;

      btn.disabled = true;
      btn.innerText = "Processing...";

      const orderData = {
        product: selectedProductTitle,
        price: selectedProductPrice,
        size: document.getElementById("custSize").value,
        customerName: document.getElementById("custName").value,
        phone: document.getElementById("custPhone").value,
        address: document.getElementById("custAddress").value,
        paymentMethod: payMethod,
        bkashSenderNumber: payMethod === "bKash" ? document.getElementById("bkashSenderNum").value : "N/A",
        transactionId: payMethod === "bKash" ? document.getElementById("bkashTrxId").value : "N/A",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("orders").add(orderData).then(() => {
        status.innerText = "🎉 Order Placed Successfully!";
        document.getElementById("orderForm").reset();
        cart = []; // Empty cart after order
        updateCartUI();
        setTimeout(() => {
          closeModal();
          btn.disabled = false;
          btn.innerText = "Confirm Order";
        }, 2000);
      }).catch((err) => {
        console.error(err);
        status.innerText = "❌ Order Failed. Please try again.";
        btn.disabled = false;
        btn.innerText = "Confirm Order";
      });
    }
  </script>
</body>
</html>
