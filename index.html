<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Aesthetic Fashion & Apparel</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #121212; color: #fff; padding-bottom: 50px; }
    header { background: #1e1e1e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #fff; }
    .search-box { padding: 8px 12px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 40%; }
    .cart-btn { background: #e50914; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .product-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 15px; border: 1px solid #2e2e2e; text-align: center; }
    .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 5px; }
    .product-title { font-size: 18px; margin: 10px 0 5px; }
    .product-price { color: #e50914; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    
    .size-selector { margin-bottom: 15px; display: flex; justify-content: center; gap: 8px; }
    .size-btn { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .size-btn.active { background: #e50914; border-color: #e50914; }
    .add-to-cart { width: 100%; background: #333; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .add-to-cart:hover { background: #444; }

    /* Modal / Order Form Style */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; }
    .submit-order-btn { width: 100%; background: #e50914; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VAYNRO</div>
    <input type="text" id="searchBar" class="search-box" placeholder="Search products..." onkeyup="filterProducts()">
    <button class="cart-btn" onclick="openCheckout()">Cart (<span id="cartCount">0</span>)</button>
  </header>

  <div class="container">
    <div class="products-grid" id="productGrid">
      
      <!-- Sample Product 1 -->
      <div class="product-card">
        <img src="https://via.placeholder.com/300x350" alt="Aesthetic Tee">
        <div class="product-title">VAYNRO Black Aesthetic Tee</div>
        <div class="product-price">BDT 1,200</div>
        <div class="size-selector">
          <button class="size-btn" onclick="selectSize(this)">M</button>
          <button class="size-btn" onclick="selectSize(this)">L</button>
          <button class="size-btn" onclick="selectSize(this)">XL</button>
        </div>
        <button class="add-to-cart" onclick="addToCart('VAYNRO Black Aesthetic Tee', 1200, this)">Add to Cart</button>
      </div>

    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCheckout()">&times;</span>
      <h2>Complete Your Order</h2>
      <br>
      <div id="cartSummary" style="margin-bottom: 15px; font-size: 14px; color: #aaa;"></div>
      
      <form id="orderForm" onsubmit="handleOrderSubmit(event)">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="custName" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" required placeholder="017XXXXXXXX">
        </div>
        <div class="form-group">
          <label>Full Delivery Address</label>
          <textarea id="custAddress" rows="3" required placeholder="House, Road, City..."></textarea>
        </div>
        <button type="submit" class="submit-order-btn" id="submitBtn">Place Order (Cash on Delivery)</button>
      </form>
    </div>
  </div>

  <!-- Firebase Web SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAw6PTjumhTGMog6LAyCaFNuyIg2E16fd8",
      authDomain: "vaynro-website.firebaseapp.com",
      projectId: "vaynro-website",
      storageBucket: "vaynro-website.firebasestorage.app",
      messagingSenderId: "442609775562",
      appId: "1:442609775562:web:51722b9bd1c34b6cac9533",
      measurementId: "G-225DYYLGER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];
    let selectedSize = null;

    function selectSize(btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = btn.innerText;
    }

    function addToCart(title, price, btn) {
      const parent = btn.parentElement;
      const activeSizeBtn = parent.querySelector('.size-btn.active');
      
      if (!activeSizeBtn) {
        alert("Please select a size first!");
        return;
      }

      cart.push({ title, price, size: activeSizeBtn.innerText });
      document.getElementById('cartCount').innerText = cart.length;
      alert("Added to cart!");
    }

    function openCheckout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      
      let summaryText = "";
      let total = 0;
      cart.forEach((item, index) => {
        summaryText += `${index + 1}. ${item.title} (${item.size}) - BDT ${item.price}<br>`;
        total += item.price;
      });
      summaryText += `<br><strong>Total: BDT ${total}</strong>`;
      
      document.getElementById('cartSummary').innerHTML = summaryText;
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('orderModal').style.display = 'none';
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Placing Order...";
      submitBtn.disabled = true;

      const orderData = {
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        items: cart,
        status: "Pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("orders").add(orderData)
        .then(() => {
          alert("ধন্যবাদ! আপনার অর্ডারটি সফলভাবে নেওয়া হয়েছে।");
          cart = [];
          document.getElementById('cartCount').innerText = "0";
          document.getElementById('orderForm').reset();
          closeCheckout();
        })
        .catch((error) => {
          console.error("Order submit error: ", error);
          alert("অর্ডার জমা দিতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
        })
        .finally(() => {
          submitBtn.innerText = "Place Order (Cash on Delivery)";
          submitBtn.disabled = false;
        });
    }

    function filterProducts() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const products = document.querySelectorAll('.product-card');
      products.forEach(p => {
        const title = p.querySelector('.product-title').innerText.toLowerCase();
        p.style.display = title.includes(query) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
