<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAYNRO | Aesthetic Fashion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Minimal Cozy Aesthetic Style Base */
        :root {
            --bg-color: #fcfbf7;
            --card-bg: #ffffff;
            --text-main: #2c2a29;
            --text-muted: #787571;
            --border-color: #f0ede6;
            --accent-dark: #1a1a1a;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8%;
            background: rgba(252, 251, 247, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-dark);
        }

        .cart-trigger {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-count {
            background: var(--accent-dark);
            color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;
            padding: 20px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .product-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #f5f4f0;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .product-price {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .add-to-cart-btn {
            width: 100%;
            background-color: var(--accent-dark);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .add-to-cart-btn:hover {
            background-color: #333333;
        }

        /* Cart Drawer Slide-out */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: -4px 0 25px rgba(0,0,0,0.08);
            transition: right 0.3s ease;
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 20px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .checkout-btn {
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav>
        <div class="brand-logo">VAYNRO</div>
        <button class="cart-trigger" onclick="toggleCart()">
            Cart <span class="cart-count" id="cartCount">0</span>
        </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Minimal & Aesthetic Fashion</h1>
        <p>সহজ ও সাবলীল ডিজাইনে তৈরি দৈনন্দিন লাক্সারি আউটফিট।</p>
    </section>

    <!-- Products Showcase -->
    <main class="products-grid">
        <div class="product-card">
            <img src="overcoat.jpg" alt="Minimal Overcoat" class="product-image" onerror="this.src='https://via.placeholder.com/300x400/f5f4f0/2c2a29?text=VAYNRO+Product'">
            <div class="product-details">
                <div class="product-title">Cozy Minimal Overcoat</div>
                <div class="product-price">৳ ৩,৫০০</div>
                <button class="add-to-cart-btn" onclick="addToCart('Cozy Minimal Overcoat', 3500)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card">
            <img src="bag.png" alt="Aesthetic Tote Bag" class="product-image" onerror="this.src='https://via.placeholder.com/300x400/f5f4f0/2c2a29?text=VAYNRO+Product'">
            <div class="product-details">
                <div class="product-title">Aesthetic Leather Bag</div>
                <div class="product-price">৳ ১,৮০০</div>
                <button class="add-to-cart-btn" onclick="addToCart('Aesthetic Leather Bag', 1800)">Add to Cart</button>
            </div>
        </div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Your Selection</h3>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">কার্ট বর্তমানে খালি রয়েছে।</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">৳ 0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">Order via WhatsApp</button>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        let cart = JSON.parse(localStorage.getItem('vaynro_cart')) || [];

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            cartCount.innerText = cart.length;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">কার্ট বর্তমানে খালি রয়েছে।</p>';
                cartTotal.innerText = '৳ 0';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <div>
                            <div>${item.name}</div>
                            <div style="color: var(--text-muted); font-size: 12px;">৳ ${item.price}</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; cursor:pointer;">✕</button>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = html;
            cartTotal.innerText = '৳ ' + total;
            
            // Save to browser
            localStorage.setItem('vaynro_cart', JSON.stringify(cart));
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            toggleCart(true);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart(openState) {
            const cartModal = document.getElementById('cartModal');
            if (openState === true) {
                cartModal.classList.add('open');
            } else {
                cartModal.classList.toggle('open');
            }
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("আপনার কার্ট খালি!");
            
            let message = "হ্যালো VAYNRO, আমি নিচের প্রোডাক্টগুলো অর্ডার করতে চাই:\n\n";
            let total = 0;
            
            cart.forEach((item, i) => {
                message += `${i + 1}. ${item.name} - ৳${item.price}\n`;
                total += item.price;
            });

            message += `\nমোট বিল: ৳${total}`;
            
            // আপনার হোয়াটসঅ্যাপ নম্বরটি এখানে বসিয়ে নিন
            const phone = "8801700000000"; 
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Initial Load
        updateCartUI();
    </script>
</body>
</html>
