<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNRO | Aesthetic Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f3f0f9; color: #2d2342; padding: 20px; }
    header { max-width: 1200px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1d9ec; padding-bottom: 20px; }
    h1.logo { font-size: 28px; letter-spacing: 4px; color: #7c5295; text-transform: uppercase; cursor: pointer; font-weight: 700; }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: #5a4b73; text-decoration: none; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .nav-links a:hover { color: #8e52bd; }
    .cart-btn-trigger { background: #8e52bd; border: none; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; box-shadow: 0 4px 12px rgba(142, 82, 189, 0.2); }

    /* Cover Photo Fix */
    .vogue-cover-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 75vh;
      margin: 0 auto 40px auto;
      border-radius: 20px;
      overflow: hidden;
      background: #f3f0f9;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 15px 35px rgba(142, 82, 189, 0.15);
    }
    .vogue-cover-container .cover-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; }
    .card { background: #ffffff; border: 1px solid #e9e2f3; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 350px; object-fit: cover; background: #eae5f2; }
    .card-details { padding: 20px; text-align: center; }
    .card-title { font-size: 18px; color: #2d2342; margin-bottom: 8px; font-weight: 600; }
    .card-price { font-size: 16px; color: #8e52bd; font-weight: 700; }

    /* Aesthetic Popup / Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(5px); }
    .modal-content { background: #fff; max-width: 500px; width: 100%; border-radius: 24px; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #7c5295; background: none; border: none; }
    .modal-img { width: 100%; height: 280px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; border: 1px solid #e9e2f3; }
    .modal-title { font-size: 22px; font-weight: 700; color: #2d2342; margin-bottom: 5px; }
    .modal-price { font-size: 16px; font-weight: 700; color: #8e52bd; margin-bottom: 15px; }
    
    /* Size Selector */
    .size-container { margin-bottom: 15px; text-align: left; }
    .size-container label { display: block; font-size: 13px; font-weight: 600; color: #5a4b73; margin-bottom: 8px; }
    .sizes { display: flex; gap: 10px; }
    .size-btn { padding: 8px 16px; border: 1px solid #e1d9ec; background: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; color: #5a4b73; transition: 0.2s; }
    .size-btn.active { background: #8e52bd; color: #fff; border-color: #8e52bd; }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #5a4b73; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #e1d9ec; border-radius: 8px; font-size: 14px; outline: none; }
    
    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .cart-action-btn { flex: 1; background: #f3f0f9; color: #8e52bd; border: 1px solid #8e52bd; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .cart-action-btn:hover { background: #e9e2f3; }
    .order-action-btn { flex: 1; background: #8e52bd; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1 class="logo">VAYNRO</h1>
    <div class="nav-links">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <!-- কার্ট বাটনে ক্লিক করলে openCartModal() ফাংশন রান করবে -->
      <button class="cart-btn-trigger" onclick="openCartModal()">🛒 Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <!-- Full Magazine Cover Display -->
  <div class="vogue-cover-container">
    <img src="cover.jpg" alt="VAYNRO Cover" class="cover-bg">
  </div>

  <div class="product-grid" id="productGrid">
    <p style="text-align: center; width: 100%; color: #7d6e93;">Loading catalog...</p>
  </div>

  <!-- Aesthetic Product Details & Checkout Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-price" id="modalPrice"></div>
      
      <!-- Size Selection -->
      <div class="size-container">
        <label>Select Size</label>
        <div class="sizes">
          <button class="size-btn active" onclick="selectSize(this, 'S')">S</button>
          <button class="size-btn" onclick="selectSize(this, 'M')">M</button>
          <button class="size-btn" onclick="selectSize(this, 'L')">L</button>
          <button class="size-btn" onclick="selectSize(this, 'XL')">XL</button>
        </div>
      </div>

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="buyerName" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="buyerPhone" placeholder="01XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>Delivery Address</label>
        <input type="text" id="buyerAddress" placeholder="House, Road, City">
      </div>

      <!-- Delivery Location (Charge calculation) -->
      <div class="form-group">
        <label>Delivery Area</label>
        <select id="deliveryLocation">
          <option value="inside_dhaka">Inside Dhaka (Charge: 70 BDT)</option>
          <option value="outside_dhaka">Outside Dhaka (Charge: 150 BDT)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="Cash on Delivery">Cash on Delivery</option>
          <option value="bKash">bKash Payment</option>
        </select>
      </div>

      <!-- বিকাশ পেমেন্ট বক্স -->
      <div id="bkashDetailsBox" style="display: none; background: #f9f5fc; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px dashed #8e52bd; text-align: left;">
        <p style="font-size: 13px; font-weight: 700; color: #7c5295; margin-bottom: 8px;">
          bkash Send Money: <span style="color: #d81b60; font-size: 14px;">01725373633</span>
        </p>
        <p style="font-size: 12px; color: #5a4b73; margin-bottom: 10px;">সম্পূর্ণ টাকা পেমেন্ট করে নিচের তথ্য দিন:</p>
        
        <div class="form-group" style="margin-bottom: 8px;">
          <label style="font-size: 12px;">Your bKash Number</label>
          <input type="text" id="bkashSenderPhone" placeholder="01XXXXXXXXX" style="padding: 8px; font-size: 13px;">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-size: 12px;">Transaction ID (TrxID)</label>
          <input type="text" id="bkashTrxId" placeholder="e.g. 9N7A..." style="padding: 8px; font-size: 13px;">
        </div>
      </div>
      
      <div class="action-buttons">
        <button class="cart-action-btn" onclick="addToCart()">Add to Cart</button>
        <button class="order-action-btn" onclick="placeOrder()">Order Now</button>
      </div>
    </div>
  </div>

  <!-- Cart Items Modal -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeCartModal()">&times;</button>
      <div class="modal-title" style="margin-bottom: 15px;">Your Shopping Cart</div>
      <div id="cartItemsContainer" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
        <!-- Cart items will be loaded here dynamically -->
      </div>
      <div style="font-weight: 700; font-size: 16px; color: #8e52bd; text-align: right; margin-bottom: 15px;" id="cartTotalPrice">Total: 0 BDT</div>
      <button class="order-action-btn" style="width: 100%;" onclick="closeCartModal()">Continue Shopping</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="order.js"></script>
</body>
</html>
